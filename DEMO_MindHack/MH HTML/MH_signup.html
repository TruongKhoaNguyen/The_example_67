<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindHack - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../KH CSS/Kh_mainstyles.css">
    <link rel="stylesheet" href="../KH CSS/Kh_sign_up.css">
    <link rel="icon" type="image/png" sizes="180x180" href="../images/Web_icon.png">
</head>
<body>
    <div id="Khsu-main">
        <div class="Khsu-form">
            <h1 class="Kh-font-Jet-Bold" style="word-spacing: -5.6px;">
                <span style="color: #ff0000;">Start</span> <span style="color: #ffc000;">your free trial</span>
            </h1>
            <p style="margin-top: -7px;">No credit card required. Sign up with your work email.</p>
            <form class="row">
                <div class="Khsu-name col">
                    <input type="text" class="form-control" placeholder="First name" aria-label="First name">
                </div>
                <div class="Khsu-name col">
                    <input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
                </div>
                <div class="Khsu-email input-group flex-nowrap">
                    <input type="text" class="form-control" placeholder="Work email address" aria-describedby="addon-wrapping">
                </div>
                <div class="Khsu-pass input-group flex-nowrap">
                    <input type="text" class="form-control" placeholder="Password" aria-describedby="addon-wrapping">
                </div>
                <div class="Khsu-con-pass input-group flex-nowrap">
                    <input type="text" class="form-control" placeholder="Confirm Password" aria-describedby="addon-wrapping">
                </div>
                <div style="margin-top: 18px; width: 100%;">
                    <input type="submit" class="Khsu-button Kh-font-Mont-Med btn" value="Sign up">
                </div>
            </form>
        </div>
        <div class="Khsu-pic">
            <img src="../images/Workspace_pic.png">
        </div>
    </div>
</body>
</html>
