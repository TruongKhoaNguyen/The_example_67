<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindHack - Log In (for Developers)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../KH CSS/Kh_mainstyles.css">
    <link rel="stylesheet" href="../KH CSS/Kh_login_Dev.css">
    <link rel="icon" type="image/png" sizes="180x180" href="../images/Web_icon.png">
</head>
<body>
    <a href="../MH HTML/MindHack.html"><div id="Khlidev-Logo"></div></a>
    <div id="Trlidev-pic"></div>
    <!--  -->
    <div id="Khlidev-form">
        <h1 class="Kh-font-Jet-Bold" style="word-spacing: -7px;">
            <span class="Kh-color-red">Welcome back!</span><br>
            <span class="Kh-color-blk" style="margin-left: -2.5px; white-space: nowrap;">Login to your account</span>
        </h1>
        <p>It's nice to see you again. Ready to code?</p>
        <form id="Tr-Input" class="row">
            <div class="Khlidev-email input-group flex-nowrap">
                <input id="Tr-Email" type="text" class="form-control" placeholder="Your email" aria-describedby="addon-wrapping">
            </div>
            <div class="Khlidev-pass input-group flex-nowrap">
                <input id="Tr-Password" type="text" class="form-control" placeholder="Your password" aria-describedby="addon-wrapping">
            </div>
            <div style="margin-top: 12px; width: 100%;">
                <input type="submit" class="Khlidev-button Kh-font-Mont-Med btn" value="Log in">
            </div>
            <div id="Khlidev-Or-liw" style="width: 100%;">
                <label>───────────&emsp;Or&emsp;───────────</label>
            </div>
            <div style="margin-top: 18px; width: 100%;">
                <button id="Tr-Google-button" type="button" class="Khlidev-Google btn">
                    <img src="../images/Google_btn_icon.png" style="width: 80px; height: auto;">
                </button>
            </div>
            <div id="Khlidev-signup-need">
                <span>Don't have an account?</span>
                <br>
                <span><a href="./MH_signup.html">Sign Up</a></span>
            </div>
        </form>
    </div>
    <!--  -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="../TR JS/Tr_login_Dev.js"></script>
</body>
</html>
