<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindHack - Log In (for Companies)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../KH CSS/Kh_mainstyles.css">
    <link rel="stylesheet" href="../KH CSS/Kh_login_Com.css">
    <link rel="icon" type="image/png" sizes="180x180" href="../images/Web_icon.png">
</head>
<body>
    <a href="../MH HTML/MindHack.html"><div id="Khlicom-Logo"></div></a>
    <div id="Khlicom-top-bg">
        <img src="../images/Codescreen_LI_Com.png">
    </div>
    <div id="Khlicom-text">
        <h1 class="Kh-font-Jet-Bold" style="word-spacing: -7px;">
            <span style="color: rgb(153, 153, 153);">Login to Mind<span class="Kh-color-red">Hack</span> for Work</span>
        </h1>
        <p>For Companies</p>
        <div id="Khlicom-signup-need">
            <span style="color: gray;">Don't have an account?</span>
            <br>
            <span><a href="./MH_signup.html">Sign Up</a></span>
        </div>
    </div>
    <div id="Khlicom-form">
        <form id="Tr-Input" class="row">
            <div class="Khlicom-email col">
                <input id="Tr-Email" type="text" class="form-control" placeholder="Email" aria-describedby="addon-wrapping">
            </div>
            <div class="Khlicom-pass col">
                <input id="Tr-Password" type="text" class="form-control" placeholder="Password" aria-describedby="addon-wrapping">
            </div>
            <div style="margin-top: 12px; width: 100%;">
                <input type="submit" class="Khlicom-button Kh-font-Mont-Med btn" value="Log in">
            </div>
            <div id="Khlicom-Or-liw" style="width: 100%;">
                <label>─────────────&emsp;Or&emsp;─────────────</label>
            </div>
            <div style="margin-top: 18px; width: 100%;">
                <button id="Tr-Google-button" type="button" class="Khlicom-Google btn">
                    <img src="../images/Google_btn_icon.png" style="width: 80px; height: auto;">
                </button>
            </div>
        </form>
    </div>
    <!--  -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="../TR JS/Tr_login_Com.js"></script>
</body>
</html>
